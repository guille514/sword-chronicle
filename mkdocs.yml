site_name: Sword Chronicle
site_description: Manual de rol - Feudal Fantasy Roleplaying
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

nav:
  - Inicio: index.md
  - Reglas del Juego:
    - El Sistema: reglas/sistema.md
    - Pruebas y Dificultad: reglas/pruebas.md
  - Creación de Personajes:
    - Concepto: creacion/concepto.md
    - Habilidades: creacion/habilidades.md
  - Habilidades y Especialidades:
    - Resumen: habilidades/resumen.md
  - Destino y Cualidades:
    - Puntos de Destino: destino/puntos.md
  - Casa y Tierras:
    - Crear la Casa: casa/crear.md
  - Hechicería:
    - Esenciales: magia/esenciales.md
  - Equipo:
    - Armas y Armaduras: equipo/armas.md
  - Intriga:
    - Reglas de Intriga: intriga/reglas.md
  - Combate:
    - Reglas de Combate: combate/reglas.md
  - Guerra:
    - Reglas de Guerra: guerra/reglas.md
  - El Narrador:
    - Guía del Narrador: narrador/guia.md
  - La Era Fragmentada:
    - El Mundo: setting/mundo.md
